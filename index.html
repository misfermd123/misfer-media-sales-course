W.emails=function(){
  return '<div class="card ivory" style="margin:0 0 12px"><span class="eyebrow" style="color:#8a6a2c">Day 1 recap email</span><p><b>Subject:</b> Following up — [Business Name]</p><p>Hi [Name],</p><p>This is [Rep] from Misfer Media. I tried reaching you today because we help businesses present their services clearly and professionally online through modern websites.</p><p>I was hoping to understand how you currently manage the business website and whether improving it is something you\'re considering.</p><p>If useful, I can arrange a short walkthrough with our founder. You can reply here or reach me at [contact details].</p><p style="margin:0">Regards,<br>[Rep]<br>Misfer Media</p></div><div class="card ivory" style="margin:0 0 12px"><span class="eyebrow" style="color:#8a6a2c">Day 7 close-out email</span><p><b>Subject:</b> Closing the loop — [Business Name]</p><p>Hi [Name],</p><p>I\'ve tried reaching you a few times about the business website, so I\'ll close this out for now rather than keep interrupting your day.</p><p>If reviewing the website becomes a priority later, you\'re welcome to reply and we can arrange a short conversation.</p><p style="margin:0">Regards,<br>[Rep]<br>Misfer Media</p></div><div class="callout warn">Only mention a website observation if it is genuine and verified. No fake scarcity, guilt or repeated “just checking in” messages.</div>';
};


var QL={"m1": [{"id": "q01", "q": "You are assigned a lead list for the week. On Tuesday you spot a bakery that is not on your list and looks like a perfect fit. What do you do?", "o": ["Call the bakery once, then tell management how the call went.", "Keep working your assigned leads and tell management about the bakery.", "Keep the bakery in your own notes and call it when your list is finished."]}, {"id": "q02", "q": "A café owner on a friendly call says, \"Just give me a rough idea of the price, even a range.\" What is the best reply?", "o": ["Say prices vary a lot, then mention the lowest starting price you have heard so the call stays warm.", "Say you cannot talk about money at all, and move on to your next question about the café's website.", "Say the founder explains options and pricing once he knows what the café needs, and offer a meeting."]}, {"id": "q03", "q": "Which result is the SDR actually responsible for creating?", "o": ["A qualified founder meeting with clear handoff notes.", "A website scope the owner has agreed to during the call.", "A verbal yes from the owner that the founder can confirm later."]}, {"id": "q04", "q": "An owner asks, \"If we go ahead, can you promise the site will be live in two weeks?\" What do you say?", "o": ["Two weeks is usually realistic for a small site, and the founder will confirm it.", "It depends on the size of the site, so you explain which parts of a project usually take the longest.", "The founder confirms timelines once the scope is clear, so you cannot promise a date."]}], "m2": [{"id": "q01", "q": "An owner asks, \"So is Misfer Media mainly an AI company?\" Which answer is accurate and helpful?", "o": ["Our main service is professional websites, and AI services are an extra when they fit.", "We do websites and AI about equally, so which of the two is more interesting to you?", "AI is our main strength, and websites are one part of the package we offer to local businesses."]}, {"id": "q02", "q": "An owner asks, \"Will a better website bring me more customers?\" Which reply avoids an unsupported promise?", "o": ["In most cases, yes. A clearer site usually leads to more enquiries within a few months of launch.", "It can help people understand your services and contact you more easily, but results vary.", "Many businesses we speak to see more customers after updating their site, so it is a good bet."]}, {"id": "q03", "q": "A clinic owner mentions she misses calls when the front desk is busy. How should AI services come into the conversation?", "o": ["Note it, ask how missed calls are handled now, and mention AI only if her answers make it relevant.", "Introduce the AI receptionist now, since she has described the exact problem it solves for clinics.", "Leave AI out completely, since websites are the only service you discuss on first calls."]}], "m3": [{"id": "q01", "q": "You want to explain a \"responsive\" website to a busy plumber. Which line is best?", "o": ["It adapts the layout to every screen size, so it works across all devices.", "It means customers can read your services and call you easily from a phone.", "It keeps the site looking modern, which usually impresses visitors who open it."]}, {"id": "q02", "q": "A busy owner interrupts: \"I don't really care how it's built.\" What is your best next step?", "o": ["Briefly explain the platform you use so he feels confident about the quality of the work.", "Offer to send a short technical summary of how it is built that he can read later.", "Agree, and describe what his customers would be able to do more easily on the site."]}, {"id": "q03", "q": "Which question focuses on what changes for the business rather than on tools?", "o": ["Which platform and hosting provider is your current website built on?", "How do customers usually find your prices and opening hours today?", "Do you know how many pages and posts your current website has?"]}], "m4": [{"id": "q01", "q": "You are talking to a hair salon owner about a clear \"Book now\" button. Which statement turns the feature into honest value?", "o": ["This will fill your appointment book, because people book more when booking is easy.", "The button follows the standard design conventions that visitors now expect from websites.", "Customers can see how to book without searching, which may make booking easier for them."]}, {"id": "q02", "q": "An owner says, \"Tell me honestly, will you increase my enquiries by 30%?\" What do you say?", "o": ["You cannot promise a number; the founder can discuss what is realistic for the business.", "You cannot promise 30%, but businesses like his often see improvements of around 20% or so.", "You do not want to guess a number, but you are confident enquiries will go up a lot."]}, {"id": "q03", "q": "Which question gets a specific, honest picture of the current situation?", "o": ["Would you like your enquiries to be handled more efficiently by your team from now on?", "Are you happy with how your business is doing online at the moment overall?", "How long does it usually take for a customer's enquiry to get a reply today?"]}], "m5": [{"id": "q01", "q": "A receptionist says, \"The owner is with a customer. I can take a message.\" What is the best reply?", "o": ["Ask for the best time to reach the owner, thank her, and note it down.", "Leave a detailed message about the service so the owner can reply when free.", "Say it is a business matter and ask her to have the owner call you back today."]}, {"id": "q02", "q": "A manager says, \"I update our website, but the director signs off on spending.\" What is the best next step?", "o": ["Treat the manager as the decision-maker, since she knows the website better than anyone.", "Ask who else is involved in the decision and suggest a short conversation with both people.", "Ask for the director's direct number so you can explain the service to the director instead."]}, {"id": "q03", "q": "You are transferred to Maya, who says: \"I run our website, but my brother, the owner, decides anything we pay for.\" Who approves the purchase?", "o": ["The owner, because he approves what the business pays for.", "Maya, because she looks after the website for the business day to day.", "Maya and her brother equally, because both are involved."]}], "m6": [{"id": "q01", "q": "The owner says, \"Our site looks a bit dated.\" You had not mentioned design. What do you record?", "o": ["\"Reputation problem: weak first impression for visitors.\"", "\"Owner said the website looks dated,\" in his own words.", "\"Owner needs a redesign to fix how the site looks.\""]}, {"id": "q02", "q": "Which question explores time pressure without assuming a problem?", "o": ["Does answering all those website messages take up a lot of your day now?", "Wouldn't it help you to spend a lot less time on website enquiries?", "How do you handle customer questions that come through the website today?"]}, {"id": "q03", "q": "You noticed the opening hours are missing from the homepage. The owner says visitors rarely ask about them. What do you do?", "o": ["Explain how missing opening hours can cost businesses customers, to show why it matters.", "Note the observation and the owner's view separately, and move on without arguing.", "Record it as a confirmed problem, since you saw it yourself."]}], "m7": [{"id": "q01", "q": "Which sentence explains the outcome and the simple mechanism without promising a result?", "o": ["We build websites that bring in more enquiries for you by showing your services clearly.", "We use a custom design process that makes your business and services easy to understand online.", "We build professional websites so visitors can see your services and easily contact you."]}, {"id": "q02", "q": "An owner asks, \"Would you include a booking system and an online shop?\" What is the best reply?", "o": ["The founder decides what is included once he knows the business needs, so offer a meeting.", "Yes to a booking system, and the shop depends on the budget, which the founder can confirm.", "Those are usually priced as extras, and the founder will confirm what the cost would be."]}, {"id": "q03", "q": "Why does the founder, not the SDR, set the project scope?", "o": ["Scope will usually change after the sale anyway, so it is usually better left open until then.", "Owners expect any promise about scope to come from the person they will actually meet.", "A clear scope prevents misunderstandings about what is included and protects both sides."]}], "m8": [{"id": "q01", "q": "You have an approved concept design for a dental clinic. How do you share it with an owner?", "o": ["Say it is a concept showing what a design could look like, not a real clinic's site.", "Show it as an example of the style we usually build for clinics that are very much like his own.", "Show it and explain that clinics using designs like this tend to get more bookings."]}, {"id": "q02", "q": "An owner asks, \"Do you have a client in my industry I can ask about?\" You have no approved example. What do you say?", "o": ["Say you have worked with similar businesses and the founder can share the details.", "Say you have no approved example to share, and offer the founder's walkthrough.", "Describe a typical project for a similar business so he can picture the result."]}, {"id": "q03", "q": "Which statement is fair \"logic\" rather than a promise?", "o": ["Putting your services and phone number on the homepage makes contacting you easier.", "Putting your services and phone number on the homepage will increase your phone calls.", "Businesses that show their services and contact details clearly usually grow faster."]}], "m9": [{"id": "q01", "q": "Which opening covers who you help, the useful outcome, the simple way and a next step?", "o": ["We design professional websites for local businesses, with clean layouts and fast loading times. Can I tell you about our packages today?", "We help local businesses present their services clearly online through professional websites. Would a short founder walkthrough help?", "We help local businesses get more customers online with a professional website. Do you have two minutes to talk about it today?"]}, {"id": "q02", "q": "After your introduction the owner says, \"Okay, go on.\" What is the best next move?", "o": ["Explain the service in more detail so he understands what you offer.", "Cut it down to a single short sentence and memorise that sentence exactly as written.", "Ask one question about how the website works for his customers today."]}, {"id": "q03", "q": "You keep reading your introduction word for word and it sounds stiff. What is the better habit?", "o": ["Add more detail to the script so you have more to read from.", "Practise the four parts until you can say them naturally.", "Cut it to a single sentence and memorise that sentence exactly."]}], "m10": [{"id": "q01", "q": "You have one minute before a scheduled call and could not open the lead's website. What do you do?", "o": ["Mention that the site seemed a little slow, since many small business sites are.", "Postpone the call until you have time to look at the site properly first.", "Make the call using the opening that does not mention a website observation."]}, {"id": "q02", "q": "Before dialling, you see the lead record says \"asked not to be contacted\" last month. What do you do?", "o": ["Do not call, and tell management so the record can be checked.", "Call once to confirm whether the request still stands.", "Call, but skip any pitch and only ask who looks after the website."]}, {"id": "q03", "q": "Which step is needed before every call?", "o": ["Write a custom script based on the business's online reviews.", "Find the owner's social media pages to make the opening feel personal.", "Open the CRM record so you can log the result straight away."]}], "m11": [{"id": "q01", "q": "A voice answers, \"Good afternoon, Harbour Dental.\" Which state are you in, and what is its job?", "o": ["Gatekeeper: reach the right person or agree a next step.", "Owner: explain the service quickly before they hang up.", "Gatekeeper: pass a message to the owner about the service."]}, {"id": "q02", "q": "The owner says, \"Please send me an email in the spring.\" What outcome do you record?", "o": ["A rejection, because no meeting was booked during this call.", "A \"not now\" with the follow-up he asked for, noted with a date.", "A qualified lead, because the owner showed some interest in it."]}, {"id": "q03", "q": "Which note shows a call ended without a clear outcome?", "o": ["\"Nice chat, will try again sometime.\"", "\"Owner asked for a call on Thursday at 10:00.\"", "\"Wrong number. Checked, flagged to management.\""]}], "m12": [{"id": "q01", "q": "It is Day 1 and nobody answers the first call. If policy allows, what is the approved next step?", "o": ["Wait an hour and try again so the phone is less likely to be busy.", "One immediate redial, then a short voicemail if appropriate, and log it.", "Send the recap email first, then redial later in the day when he is free."]}, {"id": "q02", "q": "It is Day 7 and there has been no reply to any attempt. What do you do?", "o": ["Make one last call, since Day 7 closes the cycle.", "Send the close-out email, then try once more next week.", "Send the short close-out email and stop the sequence."]}, {"id": "q03", "q": "On Day 3 a gatekeeper says she cannot connect you, and you have not reached the owner on either attempt so far. Which action follows the pathway?", "o": ["Call back later this afternoon to try again at a different time of day.", "Log it and follow the Day 5 plan when it arrives, with no extra calls.", "Email the owner today to make up for the call you could not complete."]}], "m13": [{"id": "q01", "q": "It is Day 3 and the owner answers. Which opening fits best?", "o": ["Introduce Misfer Media again in full so that he has the whole picture of what we do.", "Apologise for calling again, then explain why the call is worth his time.", "Mention you called earlier this week, say why, and ask one short question."]}, {"id": "q02", "q": "The owner says, \"Not a good time. Call me Thursday afternoon.\" What do you do?", "o": ["Agree an exact time, like Thursday at 3pm, and record it as the next action.", "Say you will try on Thursday afternoon and note it down as a callback for then.", "Ask what he would like to know now, to use the time before Thursday."]}, {"id": "q03", "q": "During discovery the owner talks for a minute about staffing problems. What do you do?", "o": ["Steer back to the website quickly, since time on the call is limited.", "Explain how the service could help with the staffing issue he raised.", "Listen, then repeat back the website part to check you understood."]}], "m14": [{"id": "q01", "q": "The receptionist asks, \"What is this regarding?\" What is the best reply?", "o": ["\"It is about the business website. I want to reach whoever looks after it.\"", "\"It is a business matter for the owner, so could you please put me through?\"", "\"It is about a service I think the owner will be interested in hearing.\""]}, {"id": "q02", "q": "A receptionist says, \"We do not take sales calls.\" What do you do?", "o": ["Say it is not a sales call, just a quick question for the owner.", "Thank her, record the restriction, and stop calling that number.", "Ask whether there is anyone else you could speak to instead."]}, {"id": "q03", "q": "It is Day 5, the final call. The receptionist says the person responsible is away until next week. What do you do?", "o": ["Ask for the best direct business contact, thank her, and log it.", "Ask when exactly he returns so you can call again on that day.", "Leave your number and ask her to have him call you when he is back."]}], "m15": [{"id": "q01", "q": "Day 1: both dials ring out and go to voicemail. What do you leave?", "o": ["Your name and number, asking him to call back soon about an important business matter.", "Your name, Misfer Media, the reason in a sentence, an email to follow, and your number.", "A short pitch about the website service and what it can do, so he knows what you offer."]}, {"id": "q02", "q": "After leaving a Day 1 voicemail you remember another point you could have made. What do you do?", "o": ["Call back once more, since you have not spoken to him yet.", "Send a text with the extra point so it does not count as another call.", "Log the call, and use the point on Day 3 if it is still relevant."]}, {"id": "q03", "q": "On Day 3 nobody answers, and management has not confirmed a redial rule for Day 3. What do you do?", "o": ["Redial once as you did on Day 1, since it is the same kind of call.", "Follow the approved contact policy, make no extra calls, and log it.", "Leave a voicemail promising that you will send an email later today."]}], "m16": [{"id": "q01", "q": "The owner says, \"We have had the site for years and it is fine.\" What is the best next move?", "o": ["Ask when it was last updated, who built it and how many visitors it gets.", "Point out one thing you noticed on the site to show it could be better.", "Ask one open question, like \"What would you change?\", then listen."]}, {"id": "q02", "q": "The owner says he would like more people to find his services page. What do you do?", "o": ["Repeat it back and check you understood before deciding on a meeting.", "Say that a new website would fix that problem and offer a founder meeting.", "Ask how much he is willing to spend on getting this problem solved now."]}, {"id": "q03", "q": "A friendly owner says he has nothing he would like to change on his website. What do you record?", "o": ["Warm lead: friendly owner, follow up with him again next month.", "Possible opportunity: send his details to the founder to try a meeting.", "Not a fit for now: owner said no change planned; no meeting booked."]}], "m17": [{"id": "q01", "q": "An owner says, \"We already have a website.\" Which response uses Acknowledge, Associate, Ask well?", "o": ["\"That makes sense. Are you happy with how it helps customers contact you?\"", "\"Many businesses with a site still miss out. Can I show how ours is different?\"", "\"Understood. Our websites are more modern, so you may want to compare.\""]}, {"id": "q02", "q": "An owner asks, \"How much does it cost?\" What is the best answer?", "o": ["\"It depends on the size of the site, though most small business sites are affordable.\"", "\"It depends on what you need. The founder explains pricing, so I do not guess.\"", "\"Prices vary, so I will avoid a figure. May I ask what budget you have in mind?\""]}, {"id": "q03", "q": "An owner says, \"Not interested, thanks.\" What do you do?", "o": ["Thank him, note it, and stop contacting him about this.", "Ask what part is not of interest so you can improve your pitch.", "Ask if you can check back in a few weeks."]}], "m18": [{"id": "q01", "q": "The owner agrees to a meeting. Which details should you confirm before the call ends?", "o": ["Date, time, the services he wants, and the budget he has in mind.", "Date, time, time zone, contact details, and who else attends.", "Date, time, a rough idea of scope, and who will be paying for it."]}, {"id": "q02", "q": "You booked the meeting. Which handoff note helps the founder most?", "o": ["\"Owner Sam very interested. Great call, lots of positive energy all round. Meeting Tue 11:00. Likely to buy soon.\"", "\"Owner Sam wants a completely new site. Meeting Tue 11:00. I told him it takes about a month.\"", "\"Owner Sam. Wants services page easier to find. Meeting Tue 11:00 GST, Lina attending. Asked about timing.\""]}, {"id": "q03", "q": "When the meeting is booked, how do you describe it to the owner?", "o": ["\"It is a short demo of the finished website that our founder will personally design for you.\"", "\"A chance for the founder to understand your needs and explain options and pricing.\"", "\"It is a quick sign-up call to get your website project started this week.\""]}], "m19": [{"id": "q01", "q": "Your Day 1 call was not answered. Which email opening is honest?", "o": ["\"Thank you for your time on the phone with me today.\"", "\"Following up on the call we had earlier.\"", "\"I tried reaching you today about your website.\""]}, {"id": "q02", "q": "You are writing the Day 7 email and there has been no reply. What should it do?", "o": ["Say you have tried a few times and will close this out for now.", "Say that you will keep following up until you hear back from him.", "Say this is your final attempt and a reply today would help you."]}, {"id": "q03", "q": "You have a good story about a project in your own words, but it is not on the approved examples list. What do you do?", "o": ["Include it without client names so no one is identified.", "Include it and add that results will differ for every business.", "Leave it out and share only approved examples."]}], "m20": [{"id": "q01", "q": "Which CRM note is best for a call where the owner said the site is hard to update and agreed to a founder meeting?", "o": ["\"Owner Sam: said site is hard to update; agreed meeting Tue 11:00; send handoff notes.\"", "\"Owner Sam seemed very keen; likely to move ahead; meeting Tue 11:00; follow up soon after.\"", "\"Owner Sam spoke about site updates; meeting set Tue 11:00; hopefully a good lead.\""]}, {"id": "q02", "q": "Which describes a connected conversation but not yet a qualified opportunity?", "o": ["The owner agreed to a Tuesday meeting with the founder and gave his partner's name.", "The owner answered, listened briefly, said \"maybe later\", and gave no need or time.", "Nobody answered, but you left a voicemail and sent the recap email afterwards."]}, {"id": "q03", "q": "The owner says, \"Please do not call us again.\" What goes into the CRM?", "o": ["The exact request, the date and time, and a do-not-contact flag.", "\"Not interested\"; try again next quarter.", "The request, with a follow-up in 30 days in case he changes his mind."]}], "chk1": [{"id": "q01", "q": "An owner asks, \"Do you also build mobile apps?\" What is the best response?", "o": ["Yes, we can build most things like that, and the founder will confirm the details.", "Our main service is websites; the founder can discuss anything else that fits.", "No, apps are not something we do, so we are probably not the right fit."]}, {"id": "q02", "q": "Which statement about your role is accurate?", "o": ["I contact assigned leads, agree the scope with owners, and the founder then sets the price.", "I find businesses, contact them and book meetings, and the founder then handles delivery.", "I contact assigned leads and book founder meetings; the founder handles scope and price."]}, {"id": "q03", "q": "An owner says, \"Our site is okay, but people always phone to ask what we offer.\" What is the best next question?", "o": ["Would clearer service pages help you with that?", "What do people usually ask about when they call?", "Would it save you time if people did not need to phone?"]}, {"id": "q04", "q": "An owner asks if you have worked with restaurants. You have an approved concept design for a restaurant. What do you say?", "o": ["Say yes, and show the restaurant design as an example of your recent work.", "Say you have worked with similar businesses before, and the founder will share the details.", "Say you have a concept of what a restaurant site could look like, not client work."]}, {"id": "q05", "q": "An owner says, \"I would talk to you, but my wife handles the business accounts and decides what we buy.\" What do you do?", "o": ["Suggest a meeting with both of them and confirm their details.", "Book the meeting with him and ask him to share it with his wife.", "Book it now and add his wife later if she would like to join."]}, {"id": "q06", "q": "Which belongs in the handoff notes for the founder?", "o": ["Your view of how likely he is to buy and what budget he might have.", "A summary of the service pitch you gave and how he reacted to it.", "The owner's words about what he wants to improve, and his questions."]}], "chk2": [{"id": "q01", "q": "On Day 3 a receptionist says the owner is in tomorrow at 10:00. What do you do?", "o": ["Thank her, log the time she gave, and use it on your next scheduled call.", "Call tomorrow at 10:00, even though it falls between two scheduled calls.", "Ask her to pass on a message so the owner calls you back at 10:00."]}, {"id": "q02", "q": "On Day 1 you left a voicemail after two unanswered dials and logged it. What is next?", "o": ["Wait an hour and call again in case he is back at his desk.", "Send the short recap email and stop contacting the business today.", "Leave a second voicemail asking him to call you back later today."]}, {"id": "q03", "q": "On Day 3 the owner says, \"Remove us from your list.\" What do you do?", "o": ["Apologise briefly, confirm, record the opt-out and stop all contact.", "Apologise, then ask if he would welcome one email later.", "Agree, but still send the Day 7 email since it ends the sequence anyway."]}, {"id": "q04", "q": "A person answers and says, \"I am just the receptionist, but I can transfer you.\" What do you do?", "o": ["Give a short summary of the service so she can pass it on to the owner later.", "Say who you are, ask for the person who looks after the website, and wait.", "Ask her to tell the owner that you called, then thank her and hang up."]}, {"id": "q05", "q": "An owner says, \"Send me some information.\" What is the best reply?", "o": ["Say a brochure will not show much and a quick call would explain it far better.", "Agree, then send a long email covering everything we offer.", "Agree, ask which email to use, and confirm whether he wants a follow-up."]}, {"id": "q06", "q": "The owner asked you to call after the holiday. Which CRM note is best?", "o": ["\"Owner interested but busy at the moment; will follow up after the holiday period.\"", "\"Owner reached. Asked for call after holiday; callback agreed 12 Dec, 10:00.\"", "\"Owner reached; follow up after the holiday (date to be confirmed later).\""]}, {"id": "q07", "q": "An owner says, \"We tried a web agency before and it went badly.\" What is the best next step?", "o": ["Explain how Misfer Media works differently so that he feels more reassured.", "Say bad experiences are common and offer the founder's meeting.", "Acknowledge it, ask what went wrong, and listen without defending."]}, {"id": "q08", "q": "The owner is interested, but his business partner approves spending. Which outcome is best?", "o": ["Advance: book a founder meeting with both people and record the notes.", "Close the loop: wait for the partner to get in touch when he is ready.", "Disqualify: the owner is not the only decision-maker, so this is not a fit."]}]};
var FNP=[{"q": "You make your Day 1 call to Harbour Dental, an assigned lead. A voice says, \"Good afternoon, Harbour Dental.\" You do not know who is speaking. How should you treat the call?", "o": ["Treat it as the gatekeeper state until you know who is speaking, and ask for the website contact.", "Treat it as the owner state and start your introduction, since the business answered the phone.", "Wait for the person to say who they are, then give your full introduction either way."], "max": 15}, {"q": "The receptionist says, \"Dr Rahman is with a patient. What is this about?\" What do you say?", "o": ["Say it is a business matter and ask her to pass your number to Dr Rahman.", "Say it is about the clinic's website and you would like to reach whoever looks after it.", "Say Dr Rahman is expecting your call and ask her to put you through when he is free."], "max": 10}, {"q": "Dr Rahman comes on the line: \"Yes? I have a patient waiting.\" Earlier, on your phone, you could not find the clinic's services page easily. What do you say?", "o": ["\"Dr Rahman, I am Sam from Misfer Media. I found your services hard to find on my phone. We help clinics present services clearly online. Is that something you are considering?\"", "\"Dr Rahman, I am Sam from Misfer Media. We are a digital agency that builds websites, runs AI automation and does marketing. I can explain each of those if you have a few minutes.\"", "\"Dr Rahman, I am Sam from Misfer Media. A better website will bring you more patients, and I can show you how in two minutes.\""], "max": 10}, {"q": "Dr Rahman says, \"It is a bit old. A friend built it years ago.\" What do you do next?", "o": ["Ask who built it, when it was last updated and whether patients use it, so you have the full picture.", "Say friend-built sites are often out of date, then explain how Misfer Media's sites are different.", "Ask one open question, such as what he would most like to improve, and listen to the answer."], "max": 15}, {"q": "He asks, \"What exactly do you do? Is it all AI?\" What is the best answer?", "o": ["Say you do websites and AI automation, and ask which of the two he would like to hear about first.", "Say you are one of the developers and can explain exactly how his site would be built.", "Say the main service is professional websites that help a business explain its services and make it easy to get in touch."], "max": 10}, {"q": "He asks, \"Roughly what would it cost, and how long would it take?\" What do you say?", "o": ["Say small clinic sites usually start around a few hundred dollars and take a few weeks.", "Say the founder can explain options and pricing once he understands what the clinic needs, and that you do not want to guess.", "Say it depends on what the clinic needs, and ask what budget he has in mind so the founder can prepare."], "max": 10}, {"q": "He says, \"That sounds useful. My practice manager, Nadia, looks after our admin and agrees what we spend.\" What do you do?", "o": ["Book the meeting with Dr Rahman and ask him to tell Nadia about it afterwards.", "Ask whether Nadia should join the founder meeting, and confirm both people's details if so.", "Ask for Nadia's number so you can explain the service to her before booking anything."], "max": 10}, {"q": "Dr Rahman says, \"A meeting could work.\" What do you do?", "o": ["Offer real times, confirm date, time zone, contact details and attendees, and explain what the founder covers.", "Agree Thursday afternoon, note it down, and say you will message him the exact time later on.", "Book a time and add that the founder will prepare a free mock-up and a discount if he decides quickly."], "max": 10}, {"q": "The call is over. Which CRM entry is best?", "o": ["\"Dr Rahman very interested after a friendly, easy call. Wants a completely new site. Meeting Thu 11:00. Nadia may join. Likely to buy.\"", "\"Dr Rahman reached via receptionist, Day 1. Wants site improved. Asked cost and timing; referred to founder. Meeting Thu 11:00 GST /* ===== BOOT ===== */
async function boot(){
  $('#app').innerHTML='<div class="splash"><img src="'+LOGO+'" alt="Misfer Media"><div class="bar"><i></i></div></div>';
  document.body.classList.add('auth-mode');
  try{
    var hs=location.hash;
    if(hs.indexOf('access_token=')>-1){
      var q=new URLSearchParams(hs.replace(/^#\/?/,'').replace(/^#/,''));var tk=q.get('access_token');
      var u=await sbReq('/auth/v1/user',{anon:true,token:tk});
      SES={access_token:tk,refresh_token:q.get('refresh_token'),expires_at:Math.floor(Date.now()/1000)+(+q.get('expires_in')||3600),user:u};saveSes();
      history.replaceState(null,'',location.pathname+location.search);
      if(q.get('type')==='recovery'){UI.recovery=true;UI.auth={mode:'reset',email:'',msg:'',kind:''};}
    }
  }catch(e){history.replaceState(null,'',location.pathname+location.search);}
  if(!SES){try{var r=localStorage.getItem('misfer_session');if(r)SES=JSON.parse(r);}catch(e){SES=null;}}
  if(SES&&(!SES.access_token||!SES.user))SES=null;
  if(SES&&SES.expires_at-60<Date.now()/1000)await refresh();
  if(SES){loadPrefs();if(!UI.recovery)await loadProgress();}
  if(!SES)UI.auth=UI.auth||{mode:'login',email:'',msg:'',kind:''};
  view(false);
}
setInterval(function(){if(SES&&SES.expires_at-120<Date.now()/1000)refresh();},45000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&SES&&SES.expires_at-120<Date.now()/1000)refresh();});
window.addEventListener('storage',function(e){
  if(e.key==='misfer_session'){if(!e.newValue&&SES){clearSes();UI.auth={mode:'login',email:'',msg:'You were signed out in another tab.',kind:'good'};view(false);}
    else if(e.newValue&&!SES){boot();}}});
boot();
