<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MISFER MEDIA SALES COURSE</title>
<meta name="description" content="The Practical Sales & Cold-Calling Academy by Misfer Media">
<style>
:root{--bg:#0e0e10;--bg2:#141417;--card:#1b1b1f;--card2:#222228;--line:#2e2e35;--txt:#f2eee4;--mute:#b6b1a4;--gold:#cbaa6b;--gold2:#e8d3a2;--ivory:#f5f0e4;--ink:#1c1a16;--ok:#86d0a2;--bad:#f09a92;--r:16px;--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--serif:Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#23201a 0,transparent 60%),var(--bg);color:var(--txt);font:17px/1.6 var(--sans);min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0 0 .5em;letter-spacing:.01em}
h1{font-size:clamp(1.8rem,6vw,2.7rem)}h2{font-size:clamp(1.4rem,4.5vw,1.9rem)}h3{font-size:1.2rem}h4{font-size:1.05rem;font-family:var(--sans)}
p{margin:0 0 .9em}ul,ol{margin:0 0 1em;padding-left:1.25em}li{margin:.3em 0}
a{color:var(--gold2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:0;background:var(--gold);color:#000;padding:10px 14px;z-index:100}
.skip:focus{left:8px;top:8px}
/* top bar */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:rgba(14,14,16,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);letter-spacing:.14em;font-size:.82rem;color:var(--gold2);text-transform:uppercase;line-height:1.15;flex:1;min-width:0;text-decoration:none}
.brand b{display:block;font-weight:600}.brand span{color:var(--mute);letter-spacing:.08em;font-size:.68rem}
.iconbtn{min-width:44px;min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-size:.9rem}
.iconbtn:hover{border-color:var(--gold)}
.pct{font-size:.85rem;color:var(--gold2);white-space:nowrap}
/* layout */
.shell{display:block}
.nav{position:fixed;inset:0 auto 0 0;width:min(88vw,330px);z-index:50;background:var(--bg2);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .25s ease;overflow-y:auto;padding:16px 14px 40px;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.nav.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}.scrim.show{display:block}
.nav h5{margin:18px 0 6px;font:600 .72rem var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.nav a.item{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 10px;border-radius:10px;color:var(--txt);text-decoration:none;font-size:.95rem;line-height:1.25}
.nav a.item:hover{background:var(--card)}.nav a.item.cur{background:var(--card2);box-shadow:inset 3px 0 0 var(--gold)}
.tick{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--mute);font-size:.7rem;display:inline-flex;align-items:center;justify-content:center;color:transparent}
.tick.on{background:var(--gold);border-color:var(--gold);color:#111}
.main{padding:18px 16px 90px;padding-bottom:calc(90px + env(safe-area-inset-bottom));max-width:880px;margin:0 auto}
@media(min-width:1000px){.nav{transform:none;width:310px;top:0;border-right:1px solid var(--line)}.scrim{display:none!important}.shell{padding-left:310px}.top .menu{display:none}.main{padding:30px 32px 90px}}
/* components */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 16px}
.card.ivory{background:var(--ivory);color:var(--ink);border-color:#d9cfb6}
.card.ivory h3,.card.ivory h4{color:#2a2418}
.eyebrow{font:600 .74rem var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:999px;border:1px solid var(--gold);background:linear-gradient(180deg,#d9bb82,#b8975a);color:#17130b;font-weight:700;cursor:pointer;text-decoration:none;font-size:1rem;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:var(--gold2)}.btn.small{min-height:44px;padding:8px 16px;font-size:.92rem}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.grid.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr))}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;border:1px solid var(--line);font-size:.78rem;color:var(--mute);background:var(--bg2)}
.pill.gold{border-color:var(--gold);color:var(--gold2)}
.bar{height:8px;border-radius:99px;background:#2a2a30;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#b8975a,#e8d3a2);border-radius:99px;transition:width .6s ease}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;min-height:48px;padding:12px 14px;margin:0 0 8px;border-radius:12px;border:1px solid var(--line);background:var(--card2);cursor:pointer;line-height:1.4}
.opt:hover{border-color:var(--gold)}
.opt.sel{border-color:var(--gold);background:#2a2619}
.opt.good{border-color:var(--ok);background:#18271f}.opt.bad{border-color:var(--bad);background:#2b1a19}
.mark{flex:none;font-weight:700;min-width:1.2em}
.fb{border-left:3px solid var(--gold);padding:10px 14px;background:var(--bg2);border-radius:0 10px 10px 0;margin:10px 0}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--bad)}
.lbl{font-weight:700}
.say{background:#0f0f12;border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:12px 16px;margin:8px 0 12px;font-style:italic;color:#f6f1e4;position:relative}
.say:before{content:"Say:";display:block;font:600 .68rem var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-style:normal;margin-bottom:2px}
.ivory .say{background:#fffdf6;border-color:#d9cfb6;color:#1c1a16}
.two{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.two{grid-template-columns:1fr 1fr}}
.good-p,.poor-p{border-radius:14px;padding:14px 16px;border:1px solid}
.good-p{border-color:#2f6a49;background:#13211a}.poor-p{border-color:#7a3a35;background:#241615}
.good-p h4{color:var(--ok)}.poor-p h4{color:var(--bad)}
details.more{margin:0 0 14px;border:1px dashed var(--line);border-radius:12px;padding:0 14px}
details.more summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--gold2);font-weight:600}
details.more[open]{padding-bottom:6px}
.hero{padding:26px 0 8px}
.lessonhead{margin-bottom:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:.95rem}.kv dt{color:var(--mute)}.kv dd{margin:0}
input[type=text],textarea,select{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#101013;color:var(--txt)}
textarea{min-height:90px;resize:vertical}
label.chk{display:flex;gap:12px;align-items:flex-start;min-height:44px;padding:8px 6px;cursor:pointer;line-height:1.4}
label.chk input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:#cbaa6b}
.chk.done span{color:var(--mute);text-decoration:line-through}
.callout{border:1px solid var(--gold);background:#211d12;border-radius:14px;padding:14px 16px;margin:0 0 16px}
.callout.warn{border-color:#d19a52}
.nextrow{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:22px}
/* journey */
.jr{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,128px),1fr));counter-reset:j}
.jr button{position:relative;min-height:84px;padding:12px 10px;border-radius:14px;border:1px solid var(--line);background:var(--card2);cursor:pointer;text-align:left;font-size:.9rem;line-height:1.25}
.jr button:before{counter-increment:j;content:counter(j);display:block;color:var(--gold);font-weight:700;margin-bottom:4px}
.jr button.sel{border-color:var(--gold);background:#2a2619}
.jr small{display:block;color:var(--mute);margin-top:4px;font-size:.74rem}
/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tab{min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card2);cursor:pointer}
.tab.sel{border-color:var(--gold);background:#2a2619;color:var(--gold2)}
/* timeline */
.tl{display:grid;gap:0;position:relative;padding-left:26px}
.tl:before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--gold),#5a4a2a)}
.tl .st{position:relative;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.tl .st:before{content:"";position:absolute;left:-23px;top:20px;width:14px;height:14px;border-radius:50%;background:var(--gold);border:3px solid var(--bg)}
.tl .st.stop:before{background:#e58a82}
.tl .day{font:700 1.05rem var(--serif);color:var(--gold2)}
@media(min-width:900px){.tl{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;padding:30px 0 0}.tl:before{left:0;right:0;top:12px;bottom:auto;height:2px;width:auto}.tl .st{margin:0}.tl .st:before{left:14px;top:-26px}}
/* anatomy mock */
.mockwrap{display:flex;justify-content:center}
.mock{width:100%;max-width:560px;background:#fbf8f0;color:#222;border-radius:14px;overflow:hidden;border:1px solid #d9cfb6;font-size:.8rem;transition:max-width .3s}
.mock.phone{max-width:260px}
.mock .p{padding:10px 12px;border:2px solid transparent;transition:.2s;position:relative}
.mock .p.hl{border-color:#b8731e;background:#fff2d6;box-shadow:0 0 0 3px rgba(184,115,30,.25)}
.mock .nv{display:flex;justify-content:space-between;align-items:center;gap:6px;background:#2b2a27;color:#eee}
.mock .hero2{background:linear-gradient(135deg,#e9e1cc,#f7f2e4)}
.mock .hero2 b{font-size:1.05rem;display:block;font-family:var(--serif)}
.mock .cta{display:inline-block;background:#b8975a;color:#111;padding:5px 12px;border-radius:99px;font-weight:700;margin-top:6px}
.mock .svc{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.mock.phone .svc{grid-template-columns:1fr}
.mock .svc i{display:block;font-style:normal;background:#fff;border:1px solid #e0d6bd;border-radius:8px;padding:6px;text-align:center}
.mock .img{height:48px;border-radius:8px;background:repeating-linear-gradient(45deg,#e3dac3,#e3dac3 8px,#ece4cf 8px,#ece4cf 16px);display:flex;align-items:center;justify-content:center;color:#7b6f55}
.mock .tag{position:absolute;right:6px;top:2px;background:#b8731e;color:#fff;border-radius:99px;font-size:.65rem;padding:0 7px;display:none}
.mock .p.hl .tag{display:block}
/* engine */
.crumbs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.outcome{border-radius:14px;padding:16px;border:2px solid var(--gold);background:#211d12}
.outcome b.big{display:block;font:700 1.3rem var(--serif);color:var(--gold2);letter-spacing:.06em}
table{border-collapse:collapse;width:100%;font-size:.92rem}th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{background:var(--card2)}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cert{border:3px double var(--gold);padding:28px 18px;text-align:center;background:linear-gradient(#17140d,#0f0e0a)}
.cert h1{color:var(--gold2)}
.score{font:700 3rem var(--serif);color:var(--gold2)}
.reduce *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.fade{animation:fade .35s ease both}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tilt{transition:transform .2s}.tilt:hover{transform:translateY(-3px)}
@media print{body{background:#fff;color:#000;font-size:12pt}.top,.nav,.scrim,.nextrow,.btn,.iconbtn,.tabs{display:none!important}.shell{padding:0}.main{max-width:none;padding:0}.card,.callout{background:#fff!important;color:#000!important;border:1px solid #888!important;break-inside:avoid}details.more{border:0}.cert{background:#fff}.cert h1,.score{color:#000}.mock{max-width:100%}.fade{animation:none}a{color:#000}.say{background:#fff;color:#000}}
/* ===== v2 upgrade styles ===== */
html{scrollbar-width:thin;scrollbar-color:#8a6f3c #121214}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:#111113}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#e0c88f,#8a6f3c);border-radius:99px;border:3px solid #111113}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#f0dcab,#a98a4c)}
::selection{background:#cbaa6b;color:#17130b}
.page{animation:pg .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes pg{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card,.opt,.btn,.tab,.iconbtn{transition:transform .2s ease,border-color .2s ease,background .2s ease,box-shadow .2s ease,filter .2s}
.card:hover{border-color:#3a3a43}
.btn{box-shadow:0 6px 22px -8px rgba(203,170,107,.55)}
.btn:active{transform:scale(.98)}
.top .brand{display:flex;align-items:center;gap:10px}
.top .brand img{height:30px;width:auto;flex:none;filter:drop-shadow(0 2px 6px rgba(203,170,107,.35))}
.top .brand div{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media(max-width:420px){.top .iconbtn span{display:none}.top .iconbtn{padding:0 10px;min-width:44px}.top .brand span{display:none}.top{gap:6px;padding-left:10px;padding-right:10px}}
@media(max-width:340px){.top .pct{display:none}}
/* auth */
body.auth-mode .top,body.auth-mode .nav,body.auth-mode .scrim{display:none!important}
body.auth-mode .shell{padding-left:0!important}
body.auth-mode .main{max-width:none;padding:0}
.auth{position:relative;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 16px;padding-bottom:calc(28px + env(safe-area-inset-bottom));overflow:hidden;background:radial-gradient(900px 520px at 15% -10%,rgba(203,170,107,.22),transparent 60%),radial-gradient(700px 500px at 100% 110%,rgba(203,170,107,.12),transparent 60%),#0b0b0d}
.auth-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.auth-bg i{position:absolute;width:2px;height:140%;top:-20%;background:linear-gradient(transparent,rgba(203,170,107,.35),transparent);transform:rotate(24deg);animation:drift 14s ease-in-out infinite alternate}
.auth-bg i:nth-child(1){left:12%}.auth-bg i:nth-child(2){left:48%;animation-duration:18s;opacity:.6}.auth-bg i:nth-child(3){left:82%;animation-duration:22s;opacity:.4}
@keyframes drift{from{transform:rotate(24deg) translateX(-20px)}to{transform:rotate(24deg) translateX(30px)}}
.auth-wrap{position:relative;display:grid;gap:22px;width:100%;max-width:1020px;grid-template-columns:minmax(0,1fr);align-items:center}
@media(min-width:900px){.auth-wrap{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:56px}}
.auth-brand{text-align:center}
@media(min-width:900px){.auth-brand{text-align:left}}
.logo3d{display:inline-block;perspective:700px;margin-bottom:6px}
.logo3d img{display:block;width:clamp(150px,38vw,260px);height:auto;transform-style:preserve-3d;transition:transform .15s ease-out;filter:drop-shadow(0 14px 22px rgba(0,0,0,.65)) drop-shadow(0 0 18px rgba(203,170,107,.28));animation:floaty 6s ease-in-out infinite}
@keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -6px}}
.wordmark{font:600 .9rem var(--serif);letter-spacing:.42em;color:var(--gold2);margin:4px 0 14px;padding-left:.42em}
.auth-brand h1{font-size:clamp(1.6rem,5.4vw,2.6rem);margin-bottom:.4em}
.auth-brand p.lead{color:var(--mute);max-width:46ch;margin:0 auto 14px}
@media(min-width:900px){.auth-brand p.lead{margin-left:0}}
.ticks{list-style:none;padding:0;margin:0;display:none;gap:8px;color:var(--mute)}
@media(min-width:900px){.ticks{display:grid}}
.ticks li{display:flex;gap:10px;align-items:center;margin:0}.ticks li:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none}
.auth-card{background:linear-gradient(180deg,rgba(30,30,35,.92),rgba(20,20,23,.96));border:1px solid #34332f;border-radius:22px;padding:22px 18px;box-shadow:0 30px 80px -30px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05)}
@media(min-width:480px){.auth-card{padding:30px 28px}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#0f0f12;border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:18px}
.seg button{min-height:44px;border:0;border-radius:999px;background:transparent;color:var(--mute);cursor:pointer;font-weight:600}
.seg button.on{background:linear-gradient(180deg,#d9bb82,#b8975a);color:#17130b}
.fld{margin:0 0 14px}.fld label{display:block;font-size:.88rem;color:var(--mute);margin-bottom:6px}
.fld .in{position:relative}.fld input{display:block;width:100%;min-height:48px;font-size:16px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#101013;color:var(--txt)}input[type=email],input[type=password]{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#101013;color:var(--txt)}
.fld input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(203,170,107,.18);outline:none}
.fld .eye{position:absolute;right:4px;top:2px;min-width:44px;min-height:44px;background:transparent;border:0;color:var(--gold2);cursor:pointer;border-radius:10px}
.fld input.pw{padding-right:52px}.fld input::placeholder{color:#6d6a62}
.err{color:var(--bad);font-size:.85rem;min-height:1.1em;margin-top:4px}
.alert{border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:.92rem;border:1px solid}
.alert.bad{border-color:#7a3a35;background:#241615;color:#f6c9c4}.alert.good{border-color:#2f6a49;background:#13211a;color:#c8efd8}
.linkbtn{background:none;border:0;color:var(--gold2);text-decoration:underline;cursor:pointer;min-height:44px;padding:0 4px}
.btn.block{width:100%}
.spin{width:18px;height:18px;border-radius:50%;border:3px solid rgba(0,0,0,.25);border-top-color:#17130b;animation:sp .7s linear infinite;display:none}
.btn.loading .spin{display:inline-block}.btn.loading{pointer-events:none;opacity:.85}
@keyframes sp{to{transform:rotate(360deg)}}
.splash{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.splash img{width:140px;animation:floaty 3s ease-in-out infinite}
.splash .bar{width:160px}.splash .bar i{width:40%;animation:slide 1.2s ease-in-out infinite alternate}
@keyframes slide{from{margin-left:0}to{margin-left:60%}}
.exp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.exp label{display:flex;align-items:center;justify-content:center;text-align:center;min-height:48px;padding:8px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:.88rem;background:#101013}
.exp input{position:absolute;opacity:0;pointer-events:none}.exp label:has(input:checked){border-color:var(--gold);background:#2a2619;color:var(--gold2)}
.exp label:has(input:focus-visible){outline:3px solid var(--gold2)}
/* onboarding */
.ob{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;padding-bottom:calc(24px + env(safe-area-inset-bottom));background:radial-gradient(800px 480px at 50% -10%,rgba(203,170,107,.18),transparent 60%),#0b0b0d}
.ob-in{width:100%;max-width:560px}
.ob-top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.ob-top img{height:34px}.ob-top .stepn{margin-left:auto;color:var(--mute);font-size:.88rem}
.dots{display:flex;gap:6px;margin-bottom:18px}.dots i{flex:1;height:5px;border-radius:99px;background:#2a2a30;overflow:hidden;position:relative}.dots i.on:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#b8975a,#e8d3a2);animation:fillb .5s ease both}
@keyframes fillb{from{transform:translateX(-100%)}to{transform:none}}
.ob-card{background:linear-gradient(180deg,#1d1d21,#161619);border:1px solid #34332f;border-radius:22px;padding:26px 22px;animation:pg .45s both;box-shadow:0 30px 70px -30px #000}

var SES=null,P={},PASS=80,UI={},NETERR=false,CUR='',REFRESHING=null;
var S={reduce:false,practice:{},chk:{},onboarded:false};
function defaults(){return {reduce:false,practice:{},chk:{},onboarded:false};}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(s,r){return (r||document).querySelector(s);}
function lessonById(id){for(var i=0;i<LESSONS.length;i++){if(LESSONS[i].id===id)return LESSONS[i];}return null;}
function lessonIdx(id){for(var i=0;i<LESSONS.length;i++){if(LESSONS[i].id===id)return i;}return -1;}
function isDone(id){return !!(P[id]&&P[id].completed);}
function accessible(i){return i<=0||isDone(LESSONS[i-1].id);}
function doneCount(grp){var n=0,t=0;LESSONS.forEach(function(l){if(!grp||l.grp===grp){t++;if(isDone(l.id))n++;}});return {n:n,t:t,p:t?Math.round(100*n/t):0};}
function firstUndone(){for(var i=0;i<LESSONS.length;i++){if(!isDone(LESSONS[i].id))return LESSONS[i];}return null;}
function meta(){return (SES&&SES.user&&SES.user.user_metadata)||{};}
function userName(){var m=meta();if(m.full_name)return m.full_name;var e=SES&&SES.user&&SES.user.email;return e?e.split('@')[0]:'Student';}
function firstName(){return userName().split(/\s+/)[0];}
function exp(){return meta().experience||'';}
function nm(){return esc(firstName());}

/* ===== PER-USER PREFERENCES (not progress) ===== */
function prefKey(){return 'misfer_prefs_'+(SES&&SES.user?SES.user.id:'anon');}
function loadPrefs(){S=defaults();try{var r=localStorage.getItem(prefKey());if(r){var o=JSON.parse(r);for(var k in o){S[k]=o[k];}}}catch(e){}if(meta().onboarded)S.onboarded=true;document.body.classList.toggle('reduce',!!S.reduce);}
function save(){try{localStorage.setItem(prefKey(),JSON.stringify(S));}catch(e){}}

/* ===== SUPABASE (REST client, no third-party code) ===== */
async function sbReq(path,opt){
  opt=opt||{};var h={apikey:CFG.key,'Content-Type':'application/json'};
  var tok=!opt.anon&&SES?SES.access_token:(opt.token||null);if(tok)h.Authorization='Bearer '+tok;
  if(opt.prefer)h.Prefer=opt.prefer;var r;
  try{r=await fetch(CFG.url+path,{method:opt.method||'GET',headers:h,body:opt.body!==undefined?JSON.stringify(opt.body):undefined});}
  catch(e){throw {network:true,message:'We could not reach the server. Check your internet connection and try again.'};}
  var t=await r.text(),j=null;try{j=t?JSON.parse(t):null;}catch(e){}
  if(r.status===401&&!opt.noretry&&!opt.anon&&SES&&SES.refresh_token){if(await refresh())return sbReq(path,Object.assign({},opt,{noretry:true}));}
  if(!r.ok){throw {status:r.status,code:j&&j.code,message:(j&&(j.msg||j.message||j.error_description||j.error))||('Request failed ('+r.status+')'),body:j};}
  return j;
}
function sesFrom(j){SES={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),user:j.user||(SES&&SES.user)};saveSes();}
function saveSes(){try{localStorage.setItem('misfer_session',JSON.stringify(SES));}catch(e){}}
function clearSes(){SES=null;P={};try{localStorage.removeItem('misfer_session');}catch(e){}}
function refresh(){
  if(!SES||!SES.refresh_token)return Promise.resolve(false);
  if(REFRESHING)return REFRESHING;
  REFRESHING=(async function(){
    try{var j=await sbReq('/auth/v1/token?grant_type=refresh_token',{method:'POST',anon:true,body:{refresh_token:SES.refresh_token}});sesFrom(j);return true;}
    catch(e){if(!e.network&&(e.status===400||e.status===401||e.status===403)){clearSes();UI.expired=true;}return false;}
    finally{REFRESHING=null;}
  })();
  return REFRESHING;
}
function mapErr(e){
  var m=String(e&&e.message||'').toLowerCase();
  if(e&&e.network)return e.message;
  if(m.indexOf('invalid login')>-1)return 'That email or password is not correct. Please check and try again.';
  if(m.indexOf('already registered')>-1||m.indexOf('already been registered')>-1)return 'An account with this email already exists. Try signing in instead.';
  if(m.indexOf('email not confirmed')>-1)return 'Please confirm your email first. Check your inbox for the confirmation link.';
  if(m.indexOf('signups not allowed')>-1||m.indexOf('signup is disabled')>-1)return 'New registrations are currently switched off. Please contact support.';
  if(m.indexOf('rate limit')>-1||e.status===429)return 'Too many attempts. Please wait a minute and try again.';
  if(m.indexOf('password')>-1&&m.indexOf('least')>-1)return 'Your password is too short. Use at least 8 characters.';
  if(m.indexOf('weak')>-1)return 'That password is too easy to guess. Try a longer one with a mix of characters.';
  if(e&&e.status===404&&e.code==='PGRST202')return 'The quiz grading service has not been installed on the database yet. Please contact support.';
  return e&&e.message?e.message:'Something went wrong. Please try again.';
}
async function loadProgress(){
  try{var rows=await sbReq('/rest/v1/lesson_progress?select=*&user_id=eq.'+encodeURIComponent(SES.user.id)+'&limit=1000');P={};(rows||[]).forEach(function(r){P[r.lesson_id]=r;});NETERR=false;}
  catch(e){if(e.network){NETERR=true;}else{NETERR=true;}}
  try{var st=await sbReq('/rest/v1/course_settings?select=value&key=eq.pass_mark');if(st&&st[0]&&+st[0].value>0)PASS=+st[0].value;}catch(e){}
}
async function upsertProgress(id,completed){
  var now=new Date().toISOString();
  var body={user_id:SES.user.id,lesson_id:id,completed:completed,updated_at:now};if(completed)body.completed_at=now;
  var r=await sbReq('/rest/v1/lesson_progress?on_conflict=user_id,lesson_id',{method:'POST',prefer:'resolution=merge-duplicates,return=representation',body:body});
  if(r&&r[0])P[id]=r[0];return r;
}
async function markOpened(id){
  if(P[id]||!SES)return;
  P[id]={lesson_id:id,completed:false,quiz_score:null,updated_at:new Date().toISOString()};
  try{var r=await sbReq('/rest/v1/lesson_progress?on_conflict=user_id,lesson_id',{method:'POST',prefer:'resolution=ignore-duplicates,return=representation',body:{user_id:SES.user.id,lesson_id:id,completed:false}});if(r&&r[0])P[id]=r[0];}catch(e){delete P[id];}
}

function renderW(spec){var p=spec.split(':');var f=W[p[0]];if(!f)return '<p>Missing activity.</p>';return f(p.slice(1).join(':'));}

function rerenderWidget(el){
  var w=el.closest('[data-w]');if(!w)return;
  var a=el.getAttribute('data-a')||el.getAttribute('data-c'),i=el.getAttribute('data-i'),k=el.hasAttribute('data-a')?'a':'c';
  reW(w);
  if(a){var t=w.querySelector('[data-'+k+'="'+a+'"]'+(i!==null?'[data-i="'+i+'"]':''));if(t&&t.focus)t.focus({preventScroll:true});}
}
document.addEventListener('click',function(e){

FORMS.login=async function(f){
  var email=f.elements.email.value.trim(),pw=f.elements.password.value,er={};
  if(!EMAIL.test(email))er.email='Enter a valid email address.';if(!pw)er.password='Enter your password.';
  if(er.email||er.password){setErrs(f,er,'');return;}
  setErrs(f,{},'');busy(f,true,'Signing in…');
  try{var j=await sbReq('/auth/v1/token?grant_type=password',{method:'POST',anon:true,body:{email:email,password:pw}});sesFrom(j);busy(f,false,'Welcome back ✓');await afterLogin();}
  catch(e){busy(f,false,'Sign in');setErrs(f,{},mapErr(e));}
};
FORMS.register=async function(f){
  var name=f.elements.fullname.value.trim(),email=f.elements.email.value.trim(),pw=f.elements.password.value,cf=f.elements.confirm.value,ex=f.elements.experience.value,er={};
  if(name.length<2)er.fullname='Please enter your full name.';if(!EMAIL.test(email))er.email='Enter a valid email address.';
  if(pw.length<8)er.password='Use at least 8 characters.';if(cf!==pw)er.confirm='The passwords do not match.';
  if(Object.keys(er).length){setErrs(f,er,'');return;}
  setErrs(f,{},'');busy(f,true,'Creating your account…');
  try{
    var j=await sbReq('/auth/v1/signup',{method:'POST',anon:true,body:{email:email,password:pw,data:{full_name:name,experience:ex}}});
    if(j&&j.access_token){sesFrom(j);busy(f,false,'Account created ✓');await afterLogin();}
    else{busy(f,false,'Create my account');UI.auth.mode='login';UI.auth.email=email;UI.auth.msg='Account created. Please check your email and click the confirmation link, then sign in.';UI.auth.kind='good';view(false);}
  }catch(e){busy(f,false,'Create my account');setErrs(f,{},mapErr(e));}
};
FORMS.forgot=async function(f){
  var email=f.elements.email.value.trim();if(!EMAIL.test(email)){setErrs(f,{email:'Enter a valid email address.'},'');return;}
  setErrs(f,{},'');busy(f,true,'Sending…');
  try{await sbReq('/auth/v1/recover',{method:'POST',anon:true,body:{email:email}});UI.auth.mode='login';UI.auth.email=email;UI.auth.msg='If an account exists for that email, a reset link is on its way. Check your inbox and spam folder.';UI.auth.kind='good';view(false);}
  catch(e){busy(f,false,'Send reset link');setErrs(f,{},mapErr(e));}
};
FORMS.reset=async function(f){

function view(keep){
  var h=location.hash.replace(/^#\/?/,'');var p=h.split('/');var r=p[0]||'';
  var y=window.scrollY,html='',cur=r,title='MISFER MEDIA SALES COURSE',mode='';
  if(!SES||UI.recovery){mode='auth';html=viewAuth();cur='login';}
  else if(!S.onboarded){mode='auth';html=viewOnboard();cur='welcome';}

    if(r===''||r==='login'||r==='welcome')r='home';cur=r;
    if(r==='lesson'){var l=lessonById(p[1]),li=l?lessonIdx(l.id):-1;
      if(!l){html=viewHome();cur='home';}
      else if(!accessible(li)){UI.flash='That lesson is locked. Pass the quiz on the lesson before it to unlock it.';location.hash='#/home';return;}
      else{cur=l.id;html=viewLesson(l);title=l.t+' · Misfer Media Sales Course';markOpened(l.id);}}
    else if(r==='playbook')html=viewPlaybook();
    else if(r==='pathways')html=viewPathways();
    else if(r==='practice')html=viewPractice();
    else if(r==='tool'){html=viewTool(p[1]);cur='practice';}
    else if(r==='cert')html=viewCert();
    else if(r==='complete')html=viewComplete();
    else if(r==='library')html=viewLibrary();
    else{html=viewHome();cur='home';}
  }
  document.body.classList.toggle('auth-mode',mode==='auth');
  $('#app').innerHTML=mode==='auth'?html:'<div class="page">'+html+'</div>';
  CUR=cur;document.title=title;

  if(keep){window.scrollTo(0,y);}else{window.scrollTo(0,0);try{$('#app').focus({preventScroll:true});}catch(e){}}

}

A.dlcert=async function(el){

var LESSONS=[
{id:'s1',grp:'start',n:'Start here',t:'How this course works',mins:3,
 why:'You are starting something new. This lesson shows you the whole road, so nothing feels like a surprise.',
 simple:['This course teaches you how to introduce Misfer Media\'s website service to business owners, and how to book a meeting with our founder when it makes sense.','It has two short learning days, then a 14-day practice ramp that ends with a live test call with the founder.','Every lesson has the same shape: why it matters, a simple explanation, a picture, an example, good versus poor, then something to try.','<b>You do not need to memorise everything.</b> The playbook in the top bar holds the call maps, scripts and checklists. You can open it during practice.','At the end you complete an online simulated call. After that, you complete a <b>live test call with the founder</b>. You must pass that live test before you contact any assigned business.'],
 vis:['coursemap'],
 try:{q:'Do you have to memorise every script on day one?',o:['Yes, word for word','No. Learn the structure, practise it, and use the playbook','Only the objection answers'],a:1,e:'Scripts are training wheels. Learn the structure first. The playbook is there to help you.'},
 rem:['One idea at a time is enough.','Practise out loud, not only in your head.','Your lesson progress is saved to your account, so you can return on another device and continue where you stopped.']},
{id:'s2',grp:'start',n:'Start here',t:'The sales journey at a glance',mins:4,
 why:'Before the details, see the whole path. You will know where your work starts, and where it stops.',
 simple:['Every business moves along one path: from an assigned lead, to a conversation, to a meeting with the founder, to a decision, to delivery.','You own the first part of the path. The founder owns the middle. The delivery team owns the end.','<b>Your result is a qualified opportunity.</b> A booked meeting is not a sale. Never call it a closed client.','Before you contact real leads, you complete a separate live test call with the founder. Passing the online lessons alone does not give you permission to call.'],
 vis:['journey'],
 try:{q:'Who owns the founder walkthrough?',o:['The SDR','The founder','The delivery team'],a:1,e:'The founder does the walkthrough, confirms the solution and handles pricing and closing.'},
 rem:['Assigned lead → contact → right person → discovery → qualified → meeting.','A booked meeting is not a sale.']},

{id:'m1',grp:'d1',n:'Module 1',t:'Your job at Misfer Media',mins:7,
 why:'If you know exactly what you are responsible for, and what you are not, you can work with confidence.',
 simple:['Say it in one breath:','<div class="say">My job is to contact the businesses Misfer Media assigns to me, introduce our website service, understand whether there is a genuine opportunity, and arrange a meeting with our founder when it makes sense. The founder handles the detailed walkthrough, solution, pricing and closing.</div>','<b>Misfer Media supplies all leads.</b> You do not find businesses, build lists or buy data. You work the leads you are assigned.','You keep accurate CRM records and follow the assigned process.'],
 more:['You <b>do not</b>: build websites, promise results, promise scope or deadlines, quote or negotiate price, offer discounts, sign contracts, pretend to be the founder or a developer, invent clients or proof, or keep contacting someone who asked you to stop.'],
 vis:['bringbuild','split','comp'],
 try:'sorter',
 rem:['You create qualified opportunities. The founder closes.','Never quote price, scope or deadlines.','Respect every opt-out.']},
{id:'m2',grp:'d1',n:'Module 2',t:'What Misfer Media does and what we sell',mins:5,
 why:'You cannot explain something you do not understand. Keep this simple and true.',
 simple:['Misfer Media is a digital marketing and AI automation agency.','<b>The main service you introduce is professional website development.</b> We help businesses present themselves clearly and professionally online.','Misfer Media also offers social media marketing, SEO (search engine optimisation), video and marketing content creation, ad creative, paid advertising, AI receptionists and AI automation. <b>You do not pitch these on first calls.</b> Your first calls stay focused on websites.','<b>If a prospect asks about one of these services, the answer is yes.</b> Acknowledge it honestly, ask one simple question about what they need, note their exact words in the CRM notes, and tell them our founder can discuss what would be suitable. The founder confirms fit, scope, pricing and timing.','Example. Prospect: "Do you also handle social media?" You: "Yes, we also work in social media marketing. What are you looking to improve with it?" Then: "Thanks. I\'ll note that so our founder can discuss what would be suitable."'],
 vis:['services'],
 try:{q:'An owner asks: "Will this website guarantee me more customers?" What is the honest answer?',o:['Yes, every website brings more customers','A clear website can help people understand and contact you, but results depend on other things too','I can\'t say anything about it'],a:1,e:'A website supports trust and conversion. Results also depend on the offer, traffic, reputation and how enquiries are handled.'},
 rem:['First calls: lead with professional websites.','Other services: if asked, say yes, ask what they need, note it, pass it to the founder.','Never promise results or quote prices, scope or timelines.']},
{id:'m3',grp:'d1',n:'Module 3',t:'How business owners think',mins:5,
 why:'Owners are busy. They listen when you talk about their business, not about your tools.',
 simple:['Most owners first want to understand what the service will do for their business. Technical details can come later, when they ask or when those details affect what they are buying.','The things owners usually notice first are what improves in the business: speed, saved time, steady work, growth, fewer mistakes, a better customer experience and trust.','<b>Tools do not create value by themselves. The useful change they create is what matters.</b>'],
 vis:['ownerthink'],
 try:{q:'Which opening is better for an owner?',o:['"We use a modern code framework."','"We help customers understand your services and get in touch more easily."'],a:1,e:'The second line talks about a change the owner can picture.'},
 rem:['Talk about the change, not the tool.','Keep it short.']},
{id:'m4',grp:'d1',n:'Module 4',t:'Selling outcomes, not tools',mins:7,
 why:'This one habit changes how you sound. You turn a feature into a plain meaning, then into a possible business value.',
 simple:['Feature → plain meaning → possible value.','A useful outcome is specific. Where it is honest to do so, it can be measured.','A simple frame: <b>In [time], move from [current state] to [desired state], measured by [metric].</b>','<b>Boundary:</b> you may ask about current results and describe possible value. You may not promise a number, an improvement or a timeframe. The founder confirms what is realistic.'],
 more:['Examples of the frame, for illustration only. They are NOT promises Misfer Media may make: “Reduce average first response time from twelve hours to under thirty minutes, measured by timestamps.”','Avoid empty words like “more efficient” unless you can say what changes.'],
 vis:['feature'],
 try:{q:'May you tell an owner "we will increase your enquiries by 30%"?',o:['Yes, it sounds convincing','No. Only the founder can say what is realistic, and results are never guaranteed'],a:1,e:'SDRs never promise numbers, improvements or timeframes.'},
 rem:['Feature → meaning → possible value.','Never promise a number.']},
{id:'m5',grp:'d1',n:'Module 5',t:'Buyers, decision-makers and gatekeepers',mins:6,
 why:'Most calls start with someone who is not the owner. How you treat them decides whether you get through.',
 simple:['Three different people can be on one call:','<ul><li><b>The person who answers the phone</b> (a gatekeeper): often a receptionist or assistant. They are doing their job, and may be protecting the owner\'s time.</li><li><b>The person who looks after the website or online presence:</b> they know how it works today, but may not approve a purchase.</li><li><b>The person who can approve the purchase,</b> or is genuinely involved in that decision. This is often the owner, founder or director, sometimes together with a manager.</li></ul>','One person can be more than one of these. Do not assume that everyone who has an opinion controls the budget or has the final say.','<b>Example:</b> A manager says, "I update our site, but my director signs off on spending." Thank her. Ask who else would be involved, and suggest a short conversation with both of them. You include the right people respectfully, and you do not go around anyone.','Your job is to reach the right people respectfully. Never treat a gatekeeper as an enemy.'],
 vis:['buyer'],
 try:{q:'The receptionist says the owner is busy. What is the best attitude?',o:['Find a trick to get past them','Be polite, and ask for the best route or time to reach the right person','Hang up and call again'],a:1,e:'You are looking for routing, not a fight.'},
 rem:['Gatekeepers are people, not obstacles.','Find the right person or a legitimate next step.']},
{id:'m6',grp:'d1',n:'Module 6',t:'Understanding business problems: time, money, risk and reputation',mins:7,
 why:'Discovery is easier when you know four places where businesses commonly feel pain.',
 simple:['<b>Time:</b> slow replies, repeated tasks. <b>Money:</b> missed chances, poor conversion. <b>Risk:</b> missed enquiries, unclear records. <b>Reputation:</b> confusing information, outdated look.','<b>Never assume a business has one of these problems.</b> Ask and listen. A pain is real only when the business says so, or you can see a clear fact.','<b>Observed fact or assumption?</b> “The opening hours are missing from the homepage” is something you observed. “You are losing customers” is an assumption. Record the fact. Ask before you believe the assumption.'],
 vis:['pains'],
 try:{q:'When is a problem “real” for your notes?',o:['When you think the website looks old','When the owner confirms it, or there is a clearly observed fact'],a:1,e:'Record facts, not guesses.'},
 rem:['Ask. Do not assume.','Write down what they said, not what you hoped.']},
{id:'m7',grp:'d1',n:'Module 7',t:'Understanding our website offer',mins:8,
 why:'A clear offer has four parts. You need to understand two of them well, and know why the other two belong to the founder.',
 simple:['A strong offer has: <b>outcome</b> (the useful change), <b>mechanism</b> (the simple way it helps), <b>boundaries</b> (what is in and out) and <b>price</b>.','You understand and explain the outcome and the mechanism. <b>You do not decide boundaries, timeline or price.</b> The founder does.','Plain explanation:','<div class="say">We help businesses explain what they do, present their services professionally and make it easier for visitors to get in touch. We do that through a professionally designed website.</div>','<b>The mechanism, in plain words:</b> the website helps a visitor understand the business, see its services, trust the information and take the next step, such as calling, enquiring or booking. It does not promise a business result.'],
 more:['Why scope matters: a vague scope leads to endless requests, repeated revisions, changing expectations and unhappy clients. A clear scope protects the client and the company.','If asked for a price, say: “Our founder can understand what you need and walk you through the suitable options and pricing. I don\'t want to guess and give you the wrong figure.”'],
 vis:['anatomy','offer4'],
 try:{q:'An owner asks "How long will it take and how much?" Who answers?',o:['You, with a rough guess','The founder, after understanding what the business needs'],a:1,e:'Never invent a range or a deadline.'},
 rem:['Explain outcome and mechanism simply.','Scope, timeline and price are founder topics.']},
{id:'m8',grp:'d1',n:'Module 8',t:'Trust, proof, portfolio and prototypes',mins:7,
 why:'Trust is what lets an owner agree to a short call. Fake proof destroys it in seconds.',
 simple:['<b>Show what is real. Label what is a concept. Never invent proof.</b>','Hard proof is real, verifiable results. Soft proof is honest feedback and relevant experience. A prototype only shows what something could look like. It is not client work and does not prove a result.','You may share <b>only</b> portfolio and examples that Misfer Media has approved.','<ul><li><b>Real client result:</b> verified evidence.</li><li><b>Testimonial:</b> real, approved customer words.</li><li><b>Prototype:</b> a concept. It is not client work and it is not proof of results.</li><li><b>Pilot:</b> only if management has approved the terms and the measurements.</li><li><b>Logic:</b> a reasonable explanation, not a guarantee.</li></ul>'],
 vis:['proof'],
 try:{q:'You have an approved sample design made as a prototype. How do you describe it?',o:['"A site we built for a client"','"A concept that shows what a possible design could look like"'],a:1,e:'Label a concept as a concept.'},
 rem:['Real is real. Concept is concept.','Only approved examples.']},
{id:'m9',grp:'d1',n:'Module 9',t:'Your simple 15-second introduction',mins:8,
 why:'You will say this many times. Make it clear, calm and short.',
 simple:['Four parts: <b>Who we help → Useful outcome → Simple way → Next step.</b>','Practise the structure, not a robot recital. About 15 seconds is roughly 35 to 40 words.'],
 vis:['introparts'],
 try:'intro',
 rem:['Who → outcome → way → next step.','Natural beats perfect.']},
{id:'chk1',grp:'d1',n:'Check',t:'Day 1 knowledge check',mins:5,
 why:'A short check to see what stuck. It is practice, not a test you can fail.',
 simple:['Answer all six, then press “Check answers”. You can try again.'],
 rem:['If anything surprised you, re-open that module. Nothing is locked.']},

{id:'m10',grp:'d2',n:'Module 10',t:'Cold-calling from absolute zero',mins:8,
 why:'Many beginners feel nervous before the first dial. A simple routine takes the guesswork away.',
 simple:['A call is not just a script. <b>A call is a situation.</b> First work out the situation, then use the right words.','Your first aim is not to close a website project. It is a relevant, respectful opening and, when it fits, a meeting with the founder.','Use the checklist below before, during and after each call. Preparation time depends on the lead tier management sets. Never invent personal research.'],
 vis:['chk:before'],
 try:{q:'You could not open a lead\'s website. What do you do?',o:['Say the site has problems anyway','Use the version of the opening that does not mention a website observation'],a:1,e:'Never pretend to have inspected a website or invent a flaw.'},
 rem:['Open the CRM record before you dial.','Check calling hours and opt-outs.','One genuine observation, or none.']},
{id:'m11',grp:'d2',n:'Module 11',t:'The call state system: owner, gatekeeper, no answer',mins:10,
 why:'This is the heart of the course. Once you know the state, you know what to do.',
 simple:['There are three states: <b>1 Owner or decision-maker answers. 2 Gatekeeper answers. 3 No answer.</b>','Each state has one job. Owner: relevance, fit and a next step. Gatekeeper: respectful routing. No answer: follow the approved sequence and log it.','Every call ends in one of three valid outcomes: <b>Advance, Disqualify or Close the loop.</b>','<b>Clear does not mean forcing a yes or a no.</b> It means recording what really happened and agreeing the next appropriate action. A clear “not now”, a requested callback, a transfer, an opt-out, a disqualification or a completed close-out are all valid outcomes.','A call is not a failure just because no meeting was booked. Doing it correctly, recording it truthfully and respecting the person is what counts.','Company policy, local law, opt-outs, wrong numbers and safety rules <b>always</b> override the cadence.'],
 vis:['engine'],
 try:{q:'A call ends with "friendly chat, maybe I will try again". Is that a valid outcome?',o:['Yes','No. Record a real outcome and next action'],a:1,e:'A friendly call with no next step and no outcome is incomplete.'},
 rem:['Identify the state first.','Advance, disqualify or close the loop.','Respect “no”.']},
{id:'m12',grp:'d2',n:'Module 12',t:'The calls-first pathway: Day 1, Day 3, Day 5, Day 7',mins:8,
 why:'A clear calendar protects you and the prospect. No guessing, no chasing.',
 simple:['<b>Day 1:</b> call, plus a short recap email. <b>Day 3:</b> call. <b>Day 5:</b> call. <b>Day 7:</b> close-out email. Then stop.','<b>Day 1 is one scheduled call event.</b> The first dial and the permitted immediate redial belong together. The recap email is the separate planned email.','Each new day is a new state. Follow-up is based on the schedule, not on how you feel.','The immediate redial is described for Day 1 only. For no-answer calls on Day 3 and Day 5, follow the exact contact policy management approves, and never add unscheduled calls.','Opt-outs, wrong numbers, local rules and a clear request not to be contacted override the schedule.','Management must confirm the exact contact policy before launch.'],
 more:['<b>Movement</b> means: the decision-maker engages, the call is transferred, the right person\'s business contact is given, a time to speak is agreed, a specific “not now” is given, or you are routed to the right person.','<b>No movement</b> means: repeated voicemail with no reply, repeated gatekeeper calls with no route, only a generic address, or no next step after the sequence.','<b>Stop conditions:</b> asked not to be contacted, wrong number, not a fit, sequence complete with no movement, policy or law requires it, or a clear refusal.','Any other contact pathway needs separate management approval.'],
 vis:['timeline'],
 try:{q:'It is Day 7 and there has been no movement. What is the step?',o:['Another round of calls','Send one short close-out email, then stop'],a:1,e:'The sequence ends with the close-out email.'},
 rem:['Day 1, 3, 5, 7. Then stop.','The Day 1 redial belongs to the same attempt.']},
{id:'m13',grp:'d2',n:'Module 13',t:'Owner calls: opening, relevance and next step',mins:9,
 why:'When the owner answers, you have a short chance to be clear and useful. Do not lecture.',
 simple:['Opening: acknowledge them → why you are calling → a short plain explanation → one simple question or a brief next step.','If there is interest, ask one or two discovery questions, repeat back what you heard, then offer a founder walkthrough.','If they say no, clarify only if it is unclear. Respect a clear no.','Day 3 and Day 5 calls are shorter because you have already created some context. Acknowledge the earlier attempt and keep it brief. Do not restart the whole introduction.'],
 vis:['scripts:owner'],
 try:'scen:owner',
 rem:['Short. Honest. One question.','Day 3 and Day 5 calls are shorter than Day 1.']},
{id:'m14',grp:'d2',n:'Module 14',t:'Gatekeeper calls: respectful routing',mins:8,
 why:'A kind, clear conversation with a receptionist often gets you further than any clever trick.',
 simple:['Aim: find the right person, or a legitimate next step.','Do: be polite and short, state your name and company honestly, say why if asked, ask who looks after the website, thank them, record the result.','Do not: lie about a referral, pretend the owner expects you, use a competitor\'s name, hide the reason, or keep asking after a clear refusal.'],
 vis:['scripts:gate'],
 try:'scen:gate',
 rem:['No transfer is information, not failure.','Never lie to get through.']},
{id:'m15',grp:'d2',n:'Module 15',t:'No-answer calls: redial, voicemail and exit',mins:7,
 why:'Most calls will not be answered. A fixed routine keeps you calm and consistent.',
 simple:['Day 1 sequence: first call. If unanswered, one immediate redial <b>if company policy and local rules allow it</b>. If still unanswered, leave a short voicemail if appropriate. Log it. Stop for the day.','Voicemail is not a pitch. It does three jobs: give context, say what happens next, exit cleanly.','A completed state does not reopen because you feel anxious.'],
 vis:['scripts:noans'],
 try:'scen:noans',
 rem:['Redial only if policy allows.','Voicemail: context, next step, exit.','Log it and stop for the day.']},
{id:'m16',grp:'d2',n:'Module 16',t:'Discovery, listening and qualification',mins:9,
 why:'Good calls are mostly listening. Your questions help the owner say what matters.',
 simple:['The owner should speak more than you. Ask <b>one question at a time</b>. Pause.','Path: current state → desired state → gap → impact → next step.','Choose only one or two questions that fit. Then repeat back: “So if I understand correctly… Have I got that right?”','A friendly person is not automatically a qualified lead. Record facts, not hopes.','<b>A short example:</b>','<ol><li><b>Ask:</b> “What happens when a customer wants to know what you offer?”</li><li><b>Listen:</b> the owner says, “They phone us, which takes time.”</li><li><b>Repeat:</b> “So customers phone to ask what you offer.”</li><li><b>Confirm:</b> “Have I understood that correctly?”</li><li><b>Decide:</b> is a founder meeting useful?</li></ol>','You do not need to ask every possible question. Budget and detailed commercial questions are for the founder.'],
 vis:['discpath'],
 try:'disc',
 rem:['One question at a time.','Listen, then repeat back.','Ask about authority, need and timing. Leave budget to the founder.']},
{id:'m17',grp:'d2',n:'Module 17',t:'Objections without arguing or pressure',mins:9,
 why:'An objection is a concern, not an attack. Your calm response keeps the door open.',
 simple:['Use <b>Acknowledge → Associate → Ask</b>.','<b>Associate</b> means: connect their concern to a truthful explanation or a real, approved example. Never invent another customer, testimonial or result.','<b>An objection is a concern to understand. A clear refusal is a boundary to respect.</b> Do not try to overcome a clear no.','Never use shame, fake urgency, invented results or repeated pushing. Accept a clear no.','Price, scope and technical detail go to the founder.'],
 vis:['aaa'],
 try:'scen:obj',
 rem:['Acknowledge, associate truthfully, ask once.','A clear no is a clear no.']},
{id:'m18',grp:'d2',n:'Module 18',t:'Booking the qualified founder meeting',mins:7,
 why:'A good handoff means the founder walks in prepared and the prospect never repeats themselves.',
 simple:['A qualified meeting is a handoff. It is <b>not</b> a sale.','Explain the meeting honestly:','<div class="say">Our founder will look at your situation, walk you through relevant possibilities and answer questions. They can then explain what would be involved and the pricing if it looks like a fit.</div>','Do not promise a custom mock-up or free work unless it has been authorised. Use only real calendar availability. Send reminders only where the process and permission allow.','<b>A good handoff includes:</b>','<ul><li>The correct person and business</li><li>The reason for the meeting</li><li>Their current situation</li><li>What they would like to improve, if they said</li><li>The agreed date, time and time zone</li><li>Contact details</li><li>Anyone else who should attend</li><li>The questions they asked</li></ul>'],
 vis:['chk:meet'],
 try:{q:'The meeting is booked. What have you created?',o:['A closed client','A qualified opportunity for the founder'],a:1,e:'The sale happens later, and the founder handles it.'},
 rem:['Confirm the right person, need, time and contact details.','Send clear handoff notes.']},
{id:'m19',grp:'d2',n:'Module 19',t:'Recap emails, close-the-loop emails and follow-up',mins:6,
 why:'Short, honest emails support your calls without pressure.',
 simple:['The Day 1 recap email says who you are, what Misfer Media helps with, why you called and the next step. Keep it short.','If the call was unanswered, write “I tried reaching you”. Do not pretend you spoke.','The Day 7 close-out email closes the loop and leaves the door open. No guilt, no fake scarcity, no “just checking in” repeats.'],
 vis:['emails'],
 try:{q:'Your Day 1 call was not answered. Which email opening is honest?',o:['"Thanks for speaking with me today."','"I tried reaching you today because…"'],a:1,e:'Never imply a conversation that did not happen.'},
 rem:['Short and honest.','Day 7: close out, then stop.']},
{id:'m20',grp:'d2',n:'Module 20',t:'CRM, reporting, professional conduct and compliance',mins:9,
 why:'If it is not in the CRM, it did not happen. Good notes also help the founder and protect everyone.',
 simple:['<b>Four different things:</b>','<ul><li><b>An attempt:</b> you tried to reach someone.</li><li><b>A connected conversation:</b> you spoke with a person.</li><li><b>A qualified opportunity:</b> the right person, a genuine need or interest, and a sensible next step.</li><li><b>A booked meeting:</b> a founder meeting is confirmed with a date and time.</li></ul>','Records must contain facts, not guesses. Write what was said and what was agreed, not what you hoped.','Log every attempt right away. A team chat group is not a CRM.','Record facts: date and time, channel, who answered, call state, what happened, outcome, next action with a due date, and any opt-out.','Follow management\'s calling rules and local law. Do not invent legal advice. Never enter false notes.','<b>Good performance is balanced:</b> leads worked correctly, attempts per the process, conversations, qualified opportunities, show-up and note accuracy. Volume targets are set only after Misfer Media measures its own results.'],
 vis:['crmfields'],
 try:'crm',
 rem:['Log it now, not later.','Facts, not hopes.','Opt-outs are final.']},
{id:'chk2',grp:'d2',n:'Check',t:'Day 2 knowledge check',mins:6,
 why:'One more short check before the final call.',
 simple:['Answer all eight, then press “Check answers”.'],
 rem:['Re-open any module that felt unclear.']},

{id:'final',grp:'final',n:'Final',t:'Final simulated call and assessment',mins:15,
 why:'Show what you can do. You are scored on clarity, listening, integrity, role boundaries and next step.',
 simple:['You play the rep on one full call, from a ringing phone to a CRM note. Nine decisions, 100 points.','<b>Pass mark: 80/100 with no critical failure.</b> Critical failures are lying, inventing proof, promising price, scope or results, ignoring an opt-out, false CRM notes, or misrepresenting a prototype.','Below 80? You get focused practice and a retry. Passing means ready for supervised work, not an expert.'],
 vis:['final'],
 rem:['Calm, honest, short, with a clear next step.']}
];

/* ===== PATHWAYS ===== */
/* To add an official pathway later, fill in the `steps` array below. Nothing else needs to change. */
/* Only official pathways are shown to students. To add one later (Written-first or In-person), add an object here
   with status 'official' and a steps array of plain-text steps. Nothing else needs to change. */
var PATHWAYS=[
 {id:'calls',name:'Calls-first',status:'official',steps:null}
];
function viewPathways(){
  var h='<div class="hero fade"><span class="eyebrow">Outreach pathway</span><h1>Your approved pathway</h1><p style="color:var(--mute)">A pathway is the approved order and timing of contact. Follow it exactly.</p></div>';
  PATHWAYS.forEach(function(p){
    if(p.status!=='official')return;
    h+='<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">'+p.name+'</h3><span class="pill gold">Official</span></div>';
    if(p.id==='calls')h+='<p>Day 1 call + recap email, Day 3 call, Day 5 call, Day 7 close-out email, then stop.</p>'+wid('timeline');
    else if(p.steps&&p.steps.length)h+='<ol>'+p.steps.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ol>';
    h+='</div>';
  });
  return h;
}

/* ===== PLAYBOOK ===== */
function viewPlaybook(){
  function d(t,b,open){return '<details class="card" '+(open?'open':'')+'><summary style="cursor:pointer;min-height:44px;display:flex;align-items:center;font-family:var(--serif);font-size:1.15rem;color:var(--gold2)">'+t+'</summary><div style="margin-top:10px">'+b+'</div></details>';}
  var h='<div class="hero fade"><span class="eyebrow">Quick reference</span><h1>Sales playbook</h1><p style="color:var(--mute)">Open this while you work. Tap a heading to open or close it.</p></div>';
